<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>兵工厂战略配置 · 永誓盟工具站</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="../shared/topbar.css?v=20261106e" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">厂</div>
    <div class="brand-text">
      <h1>兵工厂战略配置</h1>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="actions">
    <div class="action-group">
      <a class="btn ghost" href="../index.html" style="text-decoration:none">🏠 返回首页</a>
    </div>
    <div class="action-group">
      <button class="btn ghost" id="btnExportCsv" title="导出 CSV 名单">导出CSV</button>
      <button class="btn ghost" id="btnRefreshData" title="优先拉取云端实时数据覆盖当前内容；云端不可用时用内置配置（可撤销）">🔄 更新最新数据</button>
      <button class="btn ghost" id="btnUndoRefresh" title="恢复到更新前的内容" hidden>↩ 撤销更新</button>
    </div>
    <div class="action-group">
      <button class="btn primary" id="btnExport">导出公示图片</button>
    </div>
    <div class="action-group cloud-group">
      <span class="cloud-status" id="cloudStatus"></span>
      <button class="btn ghost" id="btnPublish" title="把当前配置立即发布到云端，所有盟友刷新即可看到">☁ 发布</button>
      <button class="btn ghost" id="btnCloud" title="输入管理口令后，修改会实时同步到云端，所有人刷新即可看到">🔒 管理员</button>
    </div>
  </div>
</header>

<main class="page">

  <div class="card">
    <div class="card-title"><span class="dot gold"></span><h3>公示标题与公告（导出图片顶部）</h3></div>
    <div class="add-row">
      <label class="field grow">标题<input id="inTitle" type="text" maxlength="40" spellcheck="false" /></label>
    </div>
    <div class="add-row" style="margin-top:10px">
      <label class="field grow">公告（黑色粗体，每行一条）<textarea id="inNotice" rows="3" spellcheck="false" placeholder="每行一条，如：开始前3分钟开反侦察，开宠物技能。"></textarea></label>
      <label class="field grow">红色警示（红色粗体，每行一条）<textarea id="inRed" rows="3" spellcheck="false" placeholder="每行一条，如：子弹和采集很重要！！！"></textarea></label>
    </div>
    <div class="add-row" style="margin-top:10px">
      <label class="field grow">导出图片页脚（右下角水印，留空则不显示）<input id="inFoot" type="text" maxlength="40" spellcheck="false" placeholder="如：永誓盟 · 工具站" /></label>
    </div>
  </div>

  <div id="stages"></div>

  <div class="card">
    <div class="al-row" style="margin-top:0">
      <button class="btn ghost" id="btnAddStage">＋ 添加阶段</button>
      <span class="hint" style="margin:0 0 0 12px">表格里点任意文字可直接修改；「车身」为非固定人员，可各自交换位置；建筑名带游戏内建议列表。</span>
    </div>
  </div>

  <details class="card map-card">
    <summary>🗺️ 兵工厂资源地图（点开查看：建筑位置 / 开放阶段 / 积分收益）</summary>
    <img src="map.jpg" alt="兵工厂资源地图" />
  </details>

</main>

<footer class="footer">
  <span>阶段分组 · 行内编辑 · 数据仅保存在本机浏览器</span>
  <span class="sign"><a href="../index.html" style="color:inherit;text-decoration:none">← 永誓盟工具站</a></span>
</footer>

<link rel="stylesheet" href="../shared/cloud.css" />
<script src="../shared/kv-store.js?v=20261106e"></script>
<script src="default-data.js?v=20261106e"></script>
<script src="app.js?v=20261106e"></script>
</body>
</html>
