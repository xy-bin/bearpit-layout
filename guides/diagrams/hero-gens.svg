<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <rect width="680" height="360" rx="16" fill="#0d1922"/>
  <rect x="1" y="1" width="678" height="358" rx="16" fill="none" stroke="#1e3a4c" stroke-width="2"/>
  <text x="340" y="42" text-anchor="middle" fill="#e8f4ff" font-size="22" font-weight="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">英雄代际路线 · 零氪 / 微氪优先项</text>
  <text x="340" y="66" text-anchor="middle" fill="#7fa7bd" font-size="13" font-family="Microsoft YaHei, PingFang SC, sans-serif">不必每代都换，只挑每代泛用性最高的 1～2 个集中培养</text>

  <line x1="46" y1="150" x2="634" y2="150" stroke="#24506a" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
    <g>
      <circle cx="72" cy="150" r="17" fill="#56c8e8"/>
      <text x="72" y="156" fill="#06202c" font-size="14" font-weight="700">1</text>
      <text x="72" y="196" fill="#e8f4ff" font-size="14" font-weight="700">茉莉</text>
      <text x="72" y="215" fill="#8fc9dd" font-size="12">津曼</text>
      <text x="72" y="240" fill="#6e93a8" font-size="11">开荒神卡</text>
    </g>
    <g>
      <circle cx="160" cy="150" r="17" fill="#56c8e8"/>
      <text x="160" y="156" fill="#06202c" font-size="14" font-weight="700">2</text>
      <text x="160" y="196" fill="#e8f4ff" font-size="14" font-weight="700">弗林特</text>
      <text x="160" y="215" fill="#8fc9dd" font-size="12">阿隆索</text>
      <text x="160" y="240" fill="#6e93a8" font-size="11">火男 4 星</text>
    </g>
    <g>
      <circle cx="248" cy="150" r="17" fill="#38c870"/>
      <text x="248" y="156" fill="#06202c" font-size="14" font-weight="700">3</text>
      <text x="248" y="196" fill="#e8f4ff" font-size="14" font-weight="700">米娅</text>
      <text x="248" y="215" fill="#8fc9dd" font-size="12">长期主力</text>
      <text x="248" y="240" fill="#6e93a8" font-size="11">打熊核心</text>
    </g>
    <g>
      <circle cx="336" cy="150" r="17" fill="#38c870"/>
      <text x="336" y="156" fill="#06202c" font-size="14" font-weight="700">4</text>
      <text x="336" y="196" fill="#e8f4ff" font-size="14" font-weight="700">琳恩</text>
      <text x="336" y="215" fill="#8fc9dd" font-size="12">玲奈</text>
      <text x="336" y="240" fill="#6e93a8" font-size="11">解控 / 车身</text>
    </g>
    <g>
      <circle cx="424" cy="150" r="21" fill="#f0c34a" stroke="#fff0bf" stroke-width="3"/>
      <text x="424" y="156" fill="#3a2a05" font-size="14" font-weight="700">5</text>
      <text x="424" y="196" fill="#ffe9a8" font-size="14" font-weight="700">赫克托</text>
      <text x="424" y="215" fill="#ffd87a" font-size="12">格温 / 诺拉</text>
      <text x="424" y="240" fill="#c9a95e" font-size="11">当前阶段</text>
    </g>
    <g>
      <circle cx="512" cy="150" r="17" fill="#b48cff"/>
      <text x="512" y="156" fill="#1d0e33" font-size="14" font-weight="700">6</text>
      <text x="512" y="196" fill="#e8f4ff" font-size="14" font-weight="700">芮妮</text>
      <text x="512" y="215" fill="#8fc9dd" font-size="12">矛兵 T0</text>
      <text x="512" y="240" fill="#6e93a8" font-size="11">性价比高</text>
    </g>
    <g>
      <circle cx="600" cy="150" r="17" fill="#b48cff"/>
      <text x="600" y="156" fill="#1d0e33" font-size="14" font-weight="700">7</text>
      <text x="600" y="196" fill="#e8f4ff" font-size="14" font-weight="700">布拉德利</text>
      <text x="600" y="215" fill="#8fc9dd" font-size="12">AOE 清屏</text>
      <text x="600" y="240" fill="#6e93a8" font-size="11">打熊三栖</text>
    </g>
  </g>

  <rect x="40" y="278" width="600" height="60" rx="10" fill="#122b38"/>
  <text x="58" y="302" fill="#9fd8e8" font-size="13" font-family="Microsoft YaHei, PingFang SC, sans-serif">原则：先坦后输 · 优先泛用 · 集中资源 · 按代际梯度迭代</text>
  <text x="58" y="324" fill="#7fa7bd" font-size="12" font-family="Microsoft YaHei, PingFang SC, sans-serif">心愿小筑抽到 4 星即停；通用橙色碎片只给核心输出位</text>
</svg>
