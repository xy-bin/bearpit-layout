<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>堡垒开启时间 · 无尽冬日工具站</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">垒</div>
    <div class="brand-text">
      <h1>堡垒开启时间</h1>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="actions">
    <a class="btn ghost" href="../index.html" style="text-decoration:none">🏠 返回首页</a>
    <button class="btn ghost" id="btnSortTime" title="按开启时间从早到晚排序（未填时间的排最后）">⏱ 按时间排序</button>
    <button class="btn ghost" id="btnExportCsv" title="导出 CSV 名单">导出CSV</button>
    <button class="btn primary" id="btnExport">导出图片</button>
  </div>
</header>

<main class="page">

  <div class="card">
    <div class="card-title"><span class="dot gold"></span><h3>公告（导出图片底部红字，可留空）</h3></div>
    <input id="inNotice" class="notice-input" type="text" maxlength="60" spellcheck="false"
           placeholder="如：19点开始发奖励 注意通知换盟领取" />
  </div>

  <div class="card">
    <div class="card-title"><span class="dot teal"></span><h3>添加堡垒</h3></div>
    <div class="add-row">
      <label class="field">联盟<select id="fAl"></select></label>
      <label class="field">堡垒要塞<input id="fFort" list="fortList" type="text" maxlength="20" placeholder="如：3 号要塞" /></label>
      <datalist id="fortList"></datalist>
      <label class="field">开启时间<input id="fTime" type="time" /></label>
      <label class="field grow">开集结人员<input id="fWho" type="text" maxlength="30" placeholder="可选" /></label>
      <button class="btn primary" id="btnAdd">＋ 添加</button>
    </div>
    <div class="al-row">
      <span class="al-label">联盟管理：</span>
      <span id="alChips" class="al-chips"></span>
      <input id="newAl" type="text" maxlength="12" placeholder="新联盟名" spellcheck="false" />
      <button class="btn ghost" id="btnAddAl">＋ 新增联盟</button>
    </div>
    <p class="hint">提示：拖动表格行可手动调整顺序（↑↓ 按钮也可以）；「按时间排序」会覆盖手动顺序。</p>
  </div>

  <div class="card table-card">
    <div class="card-title"><span class="dot blue"></span><h3>堡垒时间表</h3><span class="card-stats" id="rowCount"></span></div>
    <table class="ftable">
      <thead>
        <tr><th class="w-drag"></th><th>联盟</th><th>堡垒要塞</th><th class="w-time">时间</th><th>开集给人员</th><th class="w-op">操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>暂无堡垒，请在上方添加</div>
  </div>

</main>

<footer class="footer">
  <span>拖动排序 · 按时间排序 · 数据仅保存在本机浏览器</span>
  <span class="sign"><a href="../index.html" style="color:inherit;text-decoration:none">← 无尽冬日工具站</a></span>
</footer>

<script src="app.js"></script>
</body>
</html>
